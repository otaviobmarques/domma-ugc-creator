# Gera o instalador da Versão para PC (Windows) e publica no GitHub Releases.
# Dispara quando o app muda na main (para lançar, suba "version" em desktop/package.json),
# ao enviar uma tag v*, ou manualmente em Actions › Instalador Windows › Run workflow.
# O electron-builder cria a tag v<versão> e o Release; se já existir, não republica.
name: Instalador Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "desktop/**"
      - "src/lib/pipeline/montagem-core.ts"
      - "src/lib/ffmpeg.ts"
      - "assets/fonts/**"
      - ".github/workflows/instalador-windows.yml"
  workflow_dispatch:

concurrency:
  group: instalador-windows
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Instalar dependências do app
        working-directory: desktop
        run: npm ci
      - name: Gerar instalador e publicar no Release
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
